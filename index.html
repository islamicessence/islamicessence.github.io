<script>
const D = [{"id": "p1", "num": "Praise 1", "cat": "Begin With Praise", "title": "All praise is for Allah", "tr": "Alhamdu lillahi Rabbil-‘alamin", "mean": "All praise is for Allah, Lord of all the worlds.", "src": "Qur'an 1:2", "page": 12, "audio": "praise-1.mp3"}, {"id": "p2", "num": "Praise 2", "cat": "Begin With Praise", "title": "Glory and praise", "tr": "Subhanallahi wa bihamdihi", "mean": "Glory be to Allah, and praise be to Him.", "src": "Bukhari, Muslim", "page": 12, "audio": "praise-2.mp3"}, {"id": "p3", "num": "Praise 3", "cat": "Begin With Praise", "title": "Glory to the Magnificent", "tr": "Subhanallahil-‘Azim", "mean": "Glory be to Allah, the Magnificent.", "src": "Bukhari, Muslim", "page": 13, "audio": "praise-3.mp3"}, {"id": "p4", "num": "Praise 4", "cat": "Begin With Praise", "title": "There is no god but Allah", "tr": "La ilaha illallahu wahdahu la sharika lah, lahul-mulku wa lahul-hamd, wa huwa ‘ala kulli shay’in qadir", "mean": "There is no god but Allah alone, with no partner. His is the dominion, His is the praise, and He has power over everything.", "src": "Bukhari, Muslim", "page": 13, "audio": "praise-4.mp3"}, {"id": "s1", "num": "Salawat", "cat": "Send Blessings on the Prophet ﷺ", "title": "Short form", "tr": "Allahumma salli ‘ala Muhammad.", "mean": "O Allah, send Your blessings upon Muhammad.", "src": "", "page": 14, "audio": "salawat-short.mp3"}, {"id": "s2", "num": "Salawat", "cat": "Send Blessings on the Prophet ﷺ", "title": "Full form (as in the prayer)", "tr": "Allahumma salli ‘ala Muhammadin wa ‘ala ali Muhammad, kama sallayta ‘ala Ibrahima wa ‘ala ali Ibrahim, innaka Hamidun Majid. Allahumma barik ‘ala Muhammadin wa ‘ala ali Muhammad, kama barakta ‘ala Ibrahima wa ‘ala ali Ibrahim, innaka Hamidun Majid.", "mean": "O Allah, send blessings on Muhammad and the family of Muhammad, as You sent blessings on Ibrahim and the family of Ibrahim. You are Praiseworthy and Glorious. O Allah, bless Muhammad and the family of Muhammad, as You blessed Ibrahim and the family of Ibrahim. You are Praiseworthy and Glorious.", "src": "Bukhari, Muslim", "page": 14, "audio": "salawat-full.mp3"}, {"id": "names", "num": "Names of Allah", "cat": "Call on Allah by His Names", "title": "Ten Names to call on", "tr": "Ya Ghaffar · Ya Razzaq · Ya Shafi · Ya Hadi · Ya Fattah · Ya Salam · Ya Rahman, Ya Rahim · Ya Hafiz · Ya Qarib · Ya Sabur", "mean": "The Ever-Forgiving · The Provider · The Healer · The Guide · The Opener · The Source of Peace · The Most Merciful · The Protector · The Near · The Most Patient", "src": "Qur'an 7:180", "page": 15, "audio": "names-of-allah.mp3"}, {"id": "1", "num": "Dua 1", "cat": "Duas of the Prophets", "title": "Adam and Hawwa: after they slipped", "tr": "Rabbana zalamna anfusana, wa in lam taghfir lana wa tarhamna lanakunanna minal-khasirin.", "mean": "Our Lord, we have wronged ourselves. If You do not forgive us and have mercy on us, we will surely be among the losers.", "src": "Qur'an 7:23", "page": 17, "audio": "dua-01.mp3"}, {"id": "2", "num": "Dua 2", "cat": "Duas of the Prophets", "title": "Nuh: asking about his son", "tr": "Rabbi inni a‘udhu bika an as’alaka ma laysa li bihi ‘ilm, wa illa taghfir li wa tarhamni akun minal-khasirin.", "mean": "My Lord, I seek refuge in You from asking You for what I have no knowledge of. Unless You forgive me and have mercy on me, I will be among the losers.", "src": "Qur'an 11:47", "page": 18, "audio": "dua-02.mp3"}, {"id": "3", "num": "Dua 3", "cat": "Duas of the Prophets", "title": "Ibrahim and Isma’il: building the Ka‘bah", "tr": "Rabbana taqabbal minna, innaka Antas-Sami’ul-‘Alim.", "mean": "Our Lord, accept this from us. You are the All-Hearing, the All-Knowing.", "src": "Qur'an 2:127", "page": 19, "audio": "dua-03.mp3"}, {"id": "4", "num": "Dua 4", "cat": "Duas of the Prophets", "title": "Ibrahim: for his family and prayer", "tr": "Rabbij’alni muqimas-salati wa min dhurriyyati, Rabbana wa taqabbal du‘a’.", "mean": "My Lord, make me one who establishes prayer, and from my descendants too. Our Lord, accept my dua.", "src": "Qur'an 14:40", "page": 20, "audio": "dua-04.mp3"}, {"id": "5", "num": "Dua 5", "cat": "Duas of the Prophets", "title": "Ibrahim: asking for a righteous child", "tr": "Rabbi hab li minas-salihin.", "mean": "My Lord, grant me a child from among the righteous.", "src": "Qur'an 37:100", "page": 21, "audio": "dua-05.mp3"}, {"id": "6", "num": "Dua 6", "cat": "Duas of the Prophets", "title": "Ibrahim and the Prophet ﷺ: when people threaten", "tr": "Hasbunallahu wa ni‘mal-wakil.", "mean": "Allah is enough for us, and He is the best Disposer of affairs.", "src": "Qur'an 3:173; Bukhari", "page": 22, "audio": "dua-06.mp3"}, {"id": "7", "num": "Dua 7", "cat": "Duas of the Prophets", "title": "Yusuf: after success", "tr": "Fatiras-samawati wal-ard, Anta waliyyi fid-dunya wal-akhirah, tawaffani musliman wa alhiqni bis-salihin.", "mean": "Creator of the heavens and the earth, You are my protector in this world and the next. Take my soul as a Muslim and join me with the righteous.", "src": "Qur'an 12:101", "page": 23, "audio": "dua-07.mp3"}, {"id": "8", "num": "Dua 8", "cat": "Duas of the Prophets", "title": "Ayyub: in long illness", "tr": "Anni massaniyad-durru wa Anta Arhamur-rahimin.", "mean": "Hardship has touched me, and You are the Most Merciful of the merciful.", "src": "Qur'an 21:83", "page": 24, "audio": "dua-08.mp3"}, {"id": "9", "num": "Dua 9", "cat": "Duas of the Prophets", "title": "Yunus: in the darkness", "tr": "La ilaha illa Anta, subhanaka, inni kuntu minaz-zalimin.", "mean": "There is no god but You. Glory be to You. I was among the wrongdoers.", "src": "Qur'an 21:87; Tirmidhi", "page": 25, "audio": "dua-09.mp3"}, {"id": "10", "num": "Dua 10", "cat": "Duas of the Prophets", "title": "Musa: before a hard task", "tr": "Rabbish-rah li sadri, wa yassir li amri, wahlul ‘uqdatam-mil-lisani, yafqahu qawli.", "mean": "My Lord, expand my chest for me, make my task easy for me, and untie the knot in my tongue so they may understand my speech.", "src": "Qur'an 20:25-28", "page": 26, "audio": "dua-10.mp3"}, {"id": "11", "num": "Dua 11", "cat": "Duas of the Prophets", "title": "Musa: alone and in need", "tr": "Rabbi inni lima anzalta ilayya min khayrin faqir.", "mean": "My Lord, I am in need of whatever good You send down to me.", "src": "Qur'an 28:24", "page": 27, "audio": "dua-11.mp3"}, {"id": "12", "num": "Dua 12", "cat": "Duas of the Prophets", "title": "Zakariyya: in old age", "tr": "Rabbi la tadharni fardan wa Anta Khayrul-warithin.", "mean": "My Lord, do not leave me alone, and You are the best of inheritors.", "src": "Qur'an 21:89", "page": 28, "audio": "dua-12.mp3"}, {"id": "13", "num": "Dua 13", "cat": "Duas of the Prophets", "title": "Sulayman: remembering blessings", "tr": "Rabbi awzi‘ni an ashkura ni‘matakal-lati an’amta ‘alayya wa ‘ala walidayya, wa an a‘mala salihan tarzahu, wa adkhilni birahmatika fi ‘ibadikas-salihin.", "mean": "My Lord, inspire me to be thankful for Your favor upon me and upon my parents, to do righteous deeds that please You, and admit me by Your mercy among Your righteous servants.", "src": "Qur'an 27:19", "page": 29, "audio": "dua-13.mp3"}, {"id": "14", "num": "Dua 14", "cat": "Duas of the Prophets", "title": "The young men of the cave: seeking guidance", "tr": "Rabbana atina min ladunka rahmatan wa hayyi’ lana min amrina rashada.", "mean": "Our Lord, grant us mercy from Yourself and prepare for us right guidance in our affair.", "src": "Qur'an 18:10", "page": 30, "audio": "dua-14.mp3"}, {"id": "15", "num": "Dua 15", "cat": "Duas of the Prophets", "title": "The Prophet Muhammad ﷺ: for knowledge", "tr": "Rabbi zidni ‘ilma.", "mean": "My Lord, increase me in knowledge.", "src": "Qur'an 20:114", "page": 31, "audio": "dua-15.mp3"}, {"id": "16", "num": "Dua 16", "cat": "At the Table", "title": "Before eating", "tr": "Bismillah.", "mean": "In the name of Allah.", "src": "Abu Dawud, Tirmidhi", "page": 35, "audio": "dua-16.mp3"}, {"id": "17", "num": "Dua 17", "cat": "At the Table", "title": "If you forgot to say it first", "tr": "Bismillahi awwalahu wa akhirah.", "mean": "In the name of Allah, at its beginning and at its end.", "src": "Abu Dawud, Tirmidhi", "page": 36, "audio": "dua-17.mp3"}, {"id": "18", "num": "Dua 18", "cat": "At the Table", "title": "After eating", "tr": "Al-ḥamdu lillāhi alladhī aṭʿamanī hādhā wa razaqanīhi min ghayri ḥawlin minnī wa lā quwwatin, ghufira lahu mā taqaddama min dhanbihi.", "mean": "Praise is for Allah, who fed me this and provided it for me without any power or strength from me.", "src": "Abu Dawud, Tirmidhi, Ibn Majah", "page": 37, "audio": "dua-18.mp3"}, {"id": "19", "num": "Dua 19", "cat": "At Home & What You Wear", "title": "Entering your home", "tr": "Bismillāhi walajnā, wa bismillāhi kharajnā, wa ʿalallāhi rabbinā tawakkalnā.", "mean": "In the name of Allah we enter, in the name of Allah we leave, and in our Lord we place our trust.", "src": "Abu Dawud", "page": 38, "audio": "dua-19.mp3"}, {"id": "20", "num": "Dua 20", "cat": "At Home & What You Wear", "title": "Leaving your home", "tr": "Bismillahi tawakkaltu ‘alallah, wa la hawla wa la quwwata illa billah.", "mean": "In the name of Allah. I place my trust in Allah. There is no might and no power except with Allah.", "src": "Abu Dawud, Tirmidhi", "page": 39, "audio": "dua-20.mp3"}, {"id": "21", "num": "Dua 21", "cat": "At Home & What You Wear", "title": "Putting on clothes", "tr": "Al-hamdu lillah-il-ladhi kasani hadha-th-thawba wa razaqanihi min ghayri hawlin minni wa la quwwah.", "mean": "Praise is for Allah, who clothed me with this (garment) and provided it for me without any power or strength from me.", "src": "Abu Dawud, Tirmidhi", "page": 40, "audio": "dua-21.mp3"}, {"id": "22", "num": "Dua 22", "cat": "Wudu & the Bathroom", "title": "Before entering the bathroom", "tr": "Allahumma inni a‘udhu bika minal-khubthi wal-khaba’ith.", "mean": "O Allah, I seek refuge in You from the male and female evil ones.", "src": "Bukhari, Muslim", "page": 41, "audio": "dua-22.mp3"}, {"id": "23", "num": "Dua 23", "cat": "Wudu & the Bathroom", "title": "After leaving the bathroom", "tr": "Ghufranak.", "mean": "I ask for Your forgiveness.", "src": "Abu Dawud, Tirmidhi, Ibn Majah", "page": 42, "audio": "dua-23.mp3"}, {"id": "24", "num": "Dua 24", "cat": "Wudu & the Bathroom", "title": "After wudu", "tr": "Ash-hadu an la ilaha illallahu wahdahu la sharika lah, wa ash-hadu anna Muhammadan ‘abduhu wa rasuluh.", "mean": "I bear witness that there is no god but Allah alone, with no partner, and I bear witness that Muhammad is His servant and messenger.", "src": "Muslim", "page": 43, "audio": "dua-24.mp3"}, {"id": "25", "num": "Dua 25", "cat": "At the Masjid & the Adhan", "title": "Entering the masjid", "tr": "Allahummaftah li abwaba rahmatik.", "mean": "O Allah, open for me the doors of Your mercy.", "src": "Muslim", "page": 44, "audio": "dua-25.mp3"}, {"id": "26", "num": "Dua 26", "cat": "At the Masjid & the Adhan", "title": "Leaving the masjid", "tr": "Allahumma inni as’aluka min fadlik.", "mean": "O Allah, I ask You for Your bounty.", "src": "Muslim", "page": 45, "audio": "dua-26.mp3"}, {"id": "27", "num": "Dua 27", "cat": "At the Masjid & the Adhan", "title": "After the adhan", "tr": "Allahumma Rabba hadhihid-da‘watit-tammati was-salatil-qa’imah, ati Muhammadanil-wasilata wal-fadilah, wab’athhu maqamam-mahmudanil- ladhi wa‘adtah.", "mean": "O Allah, Lord of this perfect call and the prayer about to be established, grant Muhammad the closest station and the highest rank, and raise him to the praised position You promised him.", "src": "Bukhari", "page": 46, "audio": "dua-27.mp3"}, {"id": "28", "num": "Dua 28", "cat": "Inside Your Prayer", "title": "The opening dua", "tr": "Allahumma ba’id bayni wa bayna khatayaya kama ba’adta baynal-mashriqi wal- maghrib. Allahumma naqqini min khatayaya kama yunaqqath-thawbul-abyadu minad- danas. Allahummaghsilni min khatayaya bith-thalji wal-ma’i wal-barad.", "mean": "O Allah, put distance between me and my mistakes as You put distance between east and west. O Allah, cleanse me of my mistakes as a white garment is cleansed of dirt. O Allah, wash my mistakes away with snow, water, and hail.", "src": "Sahih Muslim", "page": 47, "audio": "dua-28.mp3"}, {"id": "29", "num": "Dua 29", "cat": "Inside Your Prayer", "title": "In ruku", "tr": "Subhana Rabbiyal-‘Azim.", "mean": "Glory be to my Lord, the Magnificent.", "src": "Muslim, Abu Dawud, Tirmidhi", "page": 48, "audio": "dua-29.mp3"}, {"id": "30", "num": "Dua 30", "cat": "Inside Your Prayer", "title": "In sujood", "tr": "Subhana Rabbiyal-A‘la.", "mean": "Glory be to my Lord, the Most High.", "src": "Muslim, Abu Dawud, Tirmidhi", "page": 49, "audio": "dua-30.mp3"}, {"id": "31", "num": "Dua 31", "cat": "Inside Your Prayer", "title": "Between the two sujood", "tr": "Rabbighfir li, Rabbighfir li.", "mean": "My Lord, forgive me. My Lord, forgive me.", "src": "Abu Dawud, Ibn Majah", "page": 50, "audio": "dua-31.mp3"}, {"id": "32", "num": "Dua 32", "cat": "Inside Your Prayer", "title": "Before ending the prayer", "tr": "Allahumma inni a‘udhu bika min ‘adhabi jahannam, wa min ‘adhabil-qabr, wa min fitnatil-mahya wal-mamat, wa min sharri fitnatil-Masihid-Dajjal.", "mean": "O Allah, I seek refuge in You from the punishment of Hell, from the punishment of the grave, from the trials of life and death, and from the evil of the trial of the False Messiah.", "src": "Bukhari, Muslim", "page": 51, "audio": "dua-32.mp3"}, {"id": "33", "num": "Dua 33", "cat": "Guidance & Decisions", "title": "Istikhara: when you must choose", "tr": "'Allahumma inni astakhiruka bi'ilmika, wa astaqdiruka biqudratika, wa as'aluka min fadlika-l-'azim, fa innaka taqdiru wala aqdiru, wa ta'lamu wala a'lamu, wa anta'allamu-l-ghuyub. Allahumma in kunta ta'lamu anna hadha-lamra khairun li fi dini wa ma'ashi wa 'aqibati `Amri (or said, fi 'ajili `Amri wa ajilihi) fa- qdurhu li, Wa in kunta ta'lamu anna ha-dha-l-amra sharrun li fi dini wa ma'ashi wa 'aqibati `Amri (or said, fi ajili `Amri wa ajilihi) fasrifhu 'anni was-rifni 'anhu wa aqdur li alkhaira haithu kana, thumma Raddani bihi,\"", "mean": "\"O Allah, I seek Your choice on the better (of the two matters) based upon Your knowledge, and I seek Your decree based upon Your power, and I ask You for Your great bounties. For Indeed, You are the One Who Decrees, and I do not decree, and You know, and I do not know, and You are the Knower of the Unseen. O Allah, if you know this, and You are the Knower of the Unseen. O Allah, if you know this - here he should name exactly what he wishes - is better for me with regard to my religion, and my life, and my afterlife, and the end result of my affairs, then decree it to me, and make it easy for me, and bless me on it. O Allah, and if You know this to be evil for me - and he says just as he said the first time - then avert it for me, and avert me from it. And decree for me good wherever it might be, the make me content with it.", "src": "Sunan Abi Dawud 1538", "page": 52, "audio": "dua-33.mp3"}, {"id": "34", "num": "Dua 34", "cat": "Guidance & Decisions", "title": "For a steady heart", "tr": "Ya Muqallibal-qulub, thabbit qalbi ‘ala dinik.", "mean": "O Turner of hearts, keep my heart firm on Your religion.", "src": "Jami` at-Tirmidhi 2140", "page": 53, "audio": "dua-34.mp3"}, {"id": "35", "num": "Dua 35", "cat": "Guidance & Decisions", "title": "For guidance and self-restraint", "tr": "Allahumma inni as’alukal-huda wat-tuqa wal-‘afafa wal-ghina.", "mean": "O Allah, I ask You for guidance, piety, chastity, and sufficiency.", "src": "Sahih Muslim 2721a", "page": 54, "audio": "dua-35.mp3"}, {"id": "36", "num": "Dua 36", "cat": "On the Road", "title": "When you begin a journey", "tr": "Subhanal-ladhi sakhkhara lana hadha wa ma kunna lahu muqrinin, wa inna ila Rabbina lamunqalibun.", "mean": "Glory to Him who has made this subject to us, and we could never have done it ourselves, and to our Lord we will surely return.", "src": "Qur'an 43:13-14; Muslim", "page": 55, "audio": "dua-36.mp3"}, {"id": "37", "num": "Dua 37", "cat": "Provision & Debt", "title": "For lawful provision", "tr": "Allahummakfini bihalalika ‘an haramik, wa aghnini bifadlika ‘amman siwak.", "mean": "O Allah, suffice me with what You have made lawful instead of what You have forbidden, and make me independent of everyone but You by Your bounty.", "src": "Jami` at-Tirmidhi 3563", "page": 56, "audio": "dua-37.mp3"}, {"id": "38", "num": "Dua 38", "cat": "Provision & Debt", "title": "Worry, weakness, and debt", "tr": "Allahumma inni a‘udhu bika minal-hammi wal-hazan, wal-‘ajzi wal-kasal, wal-bukhli wal-jubn, wa dala‘id-dayni wa ghalabatir-rijal.", "mean": "O Allah, I seek refuge in You from worry and grief, from weakness and laziness, from miserliness and cowardice, from being overwhelmed by debt, and from being overpowered by people.", "src": "Sahih al-Bukhari 6369", "page": 57, "audio": "dua-38.mp3"}, {"id": "39", "num": "Dua 39", "cat": "Anxiety & Distress", "title": "The dua of distress", "tr": "La ilaha illallahul-‘Azimul-Halim, la ilaha illallahu Rabbul-‘arshil-‘azim, la ilaha illallahu Rabbus-samawati wa Rabbul-ardi wa Rabbul-‘arshil-karim.", "mean": "There is no god but Allah, the Magnificent, the Forbearing. There is no god but Allah, Lord of the Mighty Throne. There is no god but Allah, Lord of the heavens, Lord of the earth, and Lord of the Noble Throne.", "src": "Al-Bukhari 8/154, Muslim 4/2092", "page": 58, "audio": "dua-39.mp3"}, {"id": "40", "num": "Dua 40", "cat": "Anxiety & Distress", "title": "When you need urgent help", "tr": "Yā Ḥayyu yā Qayyūmu biraḥmatika astaghīth aṣlih lī sha'nī kullah wa lā takilnī ilā nafsī ṭarfata `ayn.", "mean": "O Ever-Living One, O Eternal One, by Your mercy I call on You to set right all my affairs. Do not place me in charge of my soul even for the blinking of an eye (i.e. a moment).", "src": "Hisn al-Muslim 88", "page": 59, "audio": "dua-40.mp3"}, {"id": "41", "num": "Dua 41", "cat": "Anxiety & Distress", "title": "When you feel you cannot cope alone", "tr": "Allahumma rahmataka arju, fala takilni ila nafsi tarfata ‘ayn, wa aslih li sha’ni kullahu, la ilaha illa Anta.", "mean": "O Allah, it is Your mercy that I hope for. Do not leave me to myself even for the blink of an eye. Set right all my affairs. There is no god but You.", "src": "Sahih Abu Dawud 3/959.", "page": 60, "audio": "dua-41.mp3"}, {"id": "42", "num": "Dua 42", "cat": "Anxiety & Distress", "title": "When you need to rely on Allah", "tr": "Hasbiyallahu la ilaha illa Huwa, ‘alayhi tawakkaltu wa Huwa Rabbul-‘arshil-‘azim.", "mean": "Allah is enough for me. There is no god but Him. In Him I place my trust, and He is Lord of the Mighty Throne.", "src": "Qur'an 9:129", "page": 61, "audio": "dua-42.mp3"}, {"id": "43", "num": "Dua 43", "cat": "Sickness & Healing", "title": "When you feel pain", "tr": "A‘udhu billahi wa qudratihi min sharri ma ajidu wa uhadhir.", "mean": "I seek refuge in Allah and in His power from the evil of what I feel and what I fear.", "src": "Sahih Muslim 2202", "page": 62, "audio": "dua-43.mp3"}, {"id": "44", "num": "Dua 44", "cat": "Sickness & Healing", "title": "When visiting someone who is sick", "tr": "La ba’s, tahurun in sha Allah.", "mean": "No harm. It is a purification, if Allah wills.", "src": "Bukhari", "page": 63, "audio": "dua-44.mp3"}, {"id": "45", "num": "Dua 45", "cat": "Sickness & Healing", "title": "A dua for healing", "tr": "Allahumma Rabban-nas, adhhibil-ba’s, washfi Antash-Shafi, la shifa’a illa shifa’uk, shifa’an la yughadiru saqama.", "mean": "O Allah, Lord of mankind, remove the harm and heal. You are the Healer. There is no healing except Your healing, a healing that leaves no illness behind.", "src": "Bukhari, Muslim", "page": 64, "audio": "dua-45.mp3"}, {"id": "46", "num": "Dua 46", "cat": "Forgiveness", "title": "When you want to start over", "tr": "Rabbighfir li wa tub ‘alayya, innaka Antat-Tawwabur-Rahim.", "mean": "My Lord, forgive me and accept my repentance. You are the Accepter of repentance, the Merciful.", "src": "Abu Dawud, Tirmidhi", "page": 65, "audio": "dua-46.mp3"}, {"id": "47", "num": "Dua 47", "cat": "Forgiveness", "title": "At the end of a gathering", "tr": "Subhanakallahumma wa bihamdika, ash-hadu an la ilaha illa Anta, astaghfiruka wa atubu ilayk.", "mean": "Glory and praise to You, O Allah. I bear witness that there is no god but You. I seek Your forgiveness and I turn to You in repentance.", "src": "Tirmidhi, Abu Dawud", "page": 66, "audio": "dua-47.mp3"}, {"id": "48", "num": "Dua 48", "cat": "Family", "title": "For your parents", "tr": "Rabbir-hamhuma kama rabbayani saghira.", "mean": "My Lord, have mercy on them as they raised me when I was small.", "src": "Qur'an 17:24", "page": 67, "audio": "dua-48.mp3"}, {"id": "49", "num": "Dua 49", "cat": "Family", "title": "For your parents and the believers", "tr": "Rabbanaghfir li wa liwalidayya wa lil-mu’minina yawma yaqumul-hisab.", "mean": "Our Lord, forgive me, my parents, and the believers on the Day when the account is established.", "src": "Qur'an 14:41", "page": 68, "audio": "dua-49.mp3"}, {"id": "50", "num": "Dua 50", "cat": "Family", "title": "For your spouse and children", "tr": "Rabbana hab lana min azwajina wa dhurriyyatina qurrata a’yun, waj’alna lil- muttaqina imama.", "mean": "Our Lord, grant us from our spouses and our children comfort to our eyes, and make us leaders for the righteous.", "src": "Qur'an 25:74", "page": 69, "audio": "dua-50.mp3"}, {"id": "51", "num": "Dua 51", "cat": "Family", "title": "When you hope for a child", "tr": "Rabbi hab li min ladunka dhurriyyatan tayyibah, innaka Sami’ud-du‘a’.", "mean": "My Lord, grant me from Yourself good offspring. You are the Hearer of dua.", "src": "Qur'an 3:38", "page": 70, "audio": "dua-51.mp3"}, {"id": "52", "num": "Dua 52", "cat": "Family", "title": "To congratulate a newly married couple", "tr": "Barakallahu laka, wa baraka ‘alayka, wa jama‘a baynakuma fi khayr.", "mean": "May Allah bless you, shower blessings upon you, and bring you together in goodness.", "src": "Abu Dawud, Tirmidhi", "page": 71, "audio": "dua-52.mp3"}, {"id": "53", "num": "Dua 53", "cat": "Knowledge & Success", "title": "When you study or learn", "tr": "Allahumma infa’ni bima ‘allamtani, wa ‘allimni ma yanfa’uni, wa zidni ‘ilma.", "mean": "O Allah, benefit me with what You have taught me, teach me what will benefit me, and increase me in knowledge.", "src": "Tirmidhi, Ibn Majah", "page": 72, "audio": "dua-53.mp3"}, {"id": "54", "num": "Dua 54", "cat": "Knowledge & Success", "title": "The dua the Prophet  ﷺmade most often", "tr": "Rabbana atina fid-dunya hasanatan wa fil-akhirati hasanatan wa qina ‘adhaban-nar.", "mean": "Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.", "src": "Qur'an 2:201; Bukhari, Muslim", "page": 73, "audio": "dua-54.mp3"}, {"id": "55", "num": "Dua 55", "cat": "Knowledge & Success", "title": "When you make a mistake or forget", "tr": "Rabbana la tu’akhidhna in nasina aw akhta’na.", "mean": "Our Lord, do not hold us accountable if we forget or make a mistake.", "src": "Qur'an 2:286", "page": 74, "audio": "dua-55.mp3"}, {"id": "56", "num": "Dua 56", "cat": "Knowledge & Success", "title": "For good worship", "tr": "Allahumma a‘inni ‘ala dhikrika wa shukrika wa husni ‘ibadatik.", "mean": "O Allah, help me to remember You, to thank You, and to worship You well.", "src": "Abu Dawud, Nasa’i", "page": 75, "audio": "dua-56.mp3"}, {"id": "57", "num": "Dua 57", "cat": "Sky & Season", "title": "When it rains", "tr": "Allahumma sayyiban nafi’a.", "mean": "O Allah, make it a beneficial rain.", "src": "Bukhari", "page": 76, "audio": "dua-57.mp3"}, {"id": "58", "num": "Dua 58", "cat": "Sky & Season", "title": "When you see the new moon", "tr": "Allahumma ahillahu ‘alayna bil-amni wal-iman, was-salamati wal-islam, Rabbi wa Rabbukallah.", "mean": "O Allah, bring this moon over us with security and faith, with safety and Islam. My Lord and your Lord is Allah.", "src": "Tirmidhi", "page": 77, "audio": "dua-58.mp3"}, {"id": "59", "num": "Dua 59", "cat": "Fasting & Ramadan", "title": "When you break your fast", "tr": "Dhahabaz-zama’u, wabtallatil-‘uruqu, wa thabatal-ajru in sha Allah.", "mean": "The thirst has gone, the veins are moist, and the reward is confirmed, if Allah wills.", "src": "Abu Dawud", "page": 78, "audio": "dua-59.mp3"}, {"id": "60", "num": "Dua 60", "cat": "Fasting & Ramadan", "title": "On the nights of Laylat al-Qadr", "tr": "Allahumma innaka ‘Afuwwun, tuhibbul-‘afwa, fa’fu ‘anni.", "mean": "O Allah, You are the Pardoner and You love to pardon, so pardon me.", "src": "Tirmidhi, Ibn Majah", "page": 79, "audio": "dua-60.mp3"}, {"id": "61", "num": "Dua 61", "cat": "Grief & Farewell", "title": "When hardship strikes", "tr": "Inna lillahi wa inna ilayhi raji‘un. Allahumma’jurni fi musibati, wakhluf li khayran minha.", "mean": "We belong to Allah and to Him we return. O Allah, reward me in my affliction and replace it with something better.", "src": "Qur'an 2:156; Muslim", "page": 80, "audio": "dua-61.mp3"}, {"id": "62", "num": "Dua 62", "cat": "Grief & Farewell", "title": "For someone who has passed away", "tr": "Allahummaghfir lahu warhamhu wa ‘afihi wa‘fu ‘anhu.", "mean": "O Allah, forgive him, have mercy on him, give him well-being, and pardon him.", "src": "Muslim", "page": 81, "audio": "dua-62.mp3"}, {"id": "63", "num": "Dua 63", "cat": "Protection & Character", "title": "When you feel afraid or stop at a new place", "tr": "A‘udhu bikalimatillahit-tammati min sharri ma khalaq.", "mean": "I seek refuge in the perfect words of Allah from the evil of what He has created.", "src": "Muslim", "page": 82, "audio": "dua-63.mp3"}, {"id": "64", "num": "Dua 64", "cat": "Protection & Character", "title": "When you feel angry", "tr": "A‘udhu billahi minash-shaytanir-rajim.", "mean": "I seek refuge in Allah from the accursed Satan.", "src": "Bukhari, Muslim", "page": 83, "audio": "dua-64.mp3"}, {"id": "65", "num": "Dua 65", "cat": "Everyday Courtesy", "title": "When you sneeze, and when you reply", "tr": "Yahdikumullahu wa yuslihu balakum.", "mean": "May Allah guide you and set right your affairs.", "src": "Bukhari", "page": 84, "audio": "dua-65.mp3"}, {"id": "66", "num": "Dua 66", "cat": "Everyday Courtesy", "title": "When someone does you a favor", "tr": "Jazakallahu khayran.", "mean": "May Allah reward you with good.", "src": "Tirmidhi", "page": 85, "audio": "dua-66.mp3"}, {"id": "67", "num": "Dua 67", "cat": "Everyday Courtesy", "title": "When you look in the mirror", "tr": "Allahumma Anta hassanta khalqi, fahassin khuluqi.", "mean": "O Allah, You made my form beautiful, so make my character beautiful.", "src": "Ahmad", "page": 86, "audio": "dua-67.mp3"}];
const PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>';
const PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>';
const $=id=>document.getElementById(id), au=$('au');
let cur=-1;
function fmt(s){if(!isFinite(s))return '0:00';s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
// build list
let html='',last='';
D.forEach((d,i)=>{if(d.cat!==last){if(last)html+='</ul>';html+='<h3>'+d.cat+'</h3><ul class="list">';last=d.cat}
 html+='<li data-i="'+i+'"><span class="mini">'+PLAY+'</span><span><div class="n">'+d.num+'</div><div class="t">'+d.title+'</div></span></li>'});
$('groups').innerHTML=html+'</ul>';
document.querySelectorAll('.list li').forEach(li=>li.onclick=()=>{location.hash=D[+li.dataset.i].id;});
function show(i,autoplay){
 if(i<0||i>=D.length)return; cur=i; const d=D[i];
 $('hero').hidden=false; $('intro').hidden=true;
 $('hLbl').textContent=d.num+'  ·  '+d.cat; $('hTitle').textContent=d.title;
 $('hTr').textContent=d.tr; $('hMean').textContent=d.mean;
 $('hSrc').textContent=(d.src?'Source: '+d.src+'  ·  ':'')+'Ebook page '+d.page;
 au.src=d.audio; au.load(); $('fill').style.width='0'; $('cur').textContent='0:00'; $('dur').textContent='';
 $('prev').setAttribute('aria-disabled',i===0); $('next').setAttribute('aria-disabled',i===D.length-1);
 $('prev').href='#'+(D[i-1]||d).id; $('next').href='#'+(D[i+1]||d).id;
 document.querySelectorAll('.list li').forEach(li=>li.classList.toggle('on',+li.dataset.i===i));
 window.scrollTo({top:0,behavior:'smooth'});
 if(autoplay) au.play().catch(()=>{}); sync();
}
function sync(){const p=!au.paused;$('play').innerHTML=p?PAUSE:PLAY;$('play').setAttribute('aria-label',p?'Pause':'Play');
 document.querySelectorAll('.list li .mini').forEach((m,k)=>m.innerHTML=(k===cur&&p)?PAUSE:PLAY);}
$('play').onclick=()=>{au.paused?au.play():au.pause()};
au.onplay=au.onpause=au.onended=sync;
au.onloadedmetadata=()=>$('dur').textContent=fmt(au.duration);
au.ontimeupdate=()=>{$('cur').textContent=fmt(au.currentTime);$('fill').style.width=(au.currentTime/au.duration*100||0)+'%'};
$('track').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();if(au.duration)au.currentTime=(e.clientX-r.left)/r.width*au.duration};
function route(first){const h=decodeURIComponent(location.hash.slice(1));const i=D.findIndex(d=>d.id===h);
 if(i>=0)show(i,!first); else if(first){/* no hash: list only */}}
window.onhashchange=()=>route(false); route(true);
</script>
</body>
</html>
